# Configuracion del servidor
server.port=8081
spring.application.name=inventario-procesos

# Datasource configuration
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/ORCLMINVP
spring.datasource.username=UTIC
spring.datasource.password=ejgallegos
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.properties.hibernate.default_schema=UTIC

# Configuracion JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
cors.allowed-origins=http://localhost:4200

# Logging
logging.level.ec.edu.espe=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO