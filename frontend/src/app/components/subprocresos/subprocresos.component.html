<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100">
    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>

    <app-panel header="Gestión de Subprocesos" styleClass="shadow-xl rounded-xl border border-green-200">
        <ng-template #icons>
            <app-button-add label="Nuevo Subproceso" icon="pi pi-plus" tooltip="Agregar nuevo subproceso" [customStyle]="{
                'box-shadow': '0 4px 15px 0 rgba(17, 153, 142, 0.4)'
            }" (onClick)="nuevoSubproceso()">
            </app-button-add>
        </ng-template>

        <!-- Formulario -->
        <div *ngIf="mostrarFormulario" class="mb-6 animate__animated animate__fadeIn">
            <p-card [header]="modoEdicion ? 'Editar Subproceso' : 'Nuevo Subproceso'"
                styleClass="border-l-4 border-green-500 shadow-lg">
                <form (ngSubmit)="guardar()" #formSubproceso="ngForm" class="space-y-6">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Proceso N2 -->
                        <div class="space-y-2">
                            <label class="block text-sm font-bold text-gray-700 flex items-center">
                                <i class="pi pi-sitemap mr-2 text-green-600"></i>
                                Proceso (N2)
                                <span class="text-red-500 ml-1">*</span>
                            </label>
                            <app-dropdown [options]="procesosN2Options" optionLabel="label" optionValue="value"
                                [(ngModel)]="formulario.procesoId" name="procesoId"
                                (ngModelChange)="onProcesoN2Change($event)"
                                placeholder="Seleccione proceso N2" styleClass="w-full" [required]="true">
                            </app-dropdown>
                        </div>

                        <!-- Nivel -->
                        <div class="space-y-2">
                            <label class="block text-sm font-bold text-gray-700 flex items-center">
                                <i class="pi pi-list mr-2 text-green-600"></i>
                                Nivel
                                <span class="text-red-500 ml-1">*</span>
                            </label>
                            <app-dropdown [options]="nivelesOptions" optionLabel="label" optionValue="value"
                                [(ngModel)]="formulario.nivel" name="nivel"
                                (ngModelChange)="onNivelChange($event)"
                                placeholder="Seleccione nivel" styleClass="w-full" [required]="true">
                            </app-dropdown>
                        </div>
                    </div>

                    <!-- Subproceso Padre (solo visible cuando nivel = 2) -->
                    <div *ngIf="formulario.nivel === 2" class="space-y-2">
                        <label class="block text-sm font-bold text-gray-700 flex items-center">
                            <i class="pi pi-arrow-up mr-2 text-green-600"></i>
                            Subproceso SP-N1 Padre
                            <span class="text-red-500 ml-1">*</span>
                        </label>
                        <app-dropdown [options]="subprocesosN1Options" optionLabel="label" optionValue="value"
                            [(ngModel)]="formulario.subprocesoPadreId" name="subprocesoPadreId"
                            placeholder="Seleccione el SP-N1 padre" styleClass="w-full"
                            [required]="formulario.nivel === 2">
                        </app-dropdown>
                        <small *ngIf="subprocesosN1Options.length <= 1" class="text-amber-600 flex items-center gap-1">
                            <i class="pi pi-exclamation-triangle"></i>
                            Primero seleccione un proceso N2 que tenga subprocesos SP-N1
                        </small>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Nombre -->
                        <div class="space-y-2">
                            <label class="block text-sm font-bold text-gray-700 flex items-center">
                                <i class="pi pi-bookmark mr-2 text-green-600"></i>
                                Nombre del Subproceso
                                <span class="text-red-500 ml-1">*</span>
                            </label>
                            <app-input-text name="nombre" [(ngModel)]="formulario.nombre" [required]="true"
                                placeholder="Ingrese el nombre del subproceso" styleClass="w-full">
                            </app-input-text>
                        </div>

                        <!-- Estado -->
                        <div class="space-y-2">
                            <label class="block text-sm font-bold text-gray-700 flex items-center">
                                <i class="pi pi-file-edit mr-2 text-green-600"></i>
                                Estado de Documentación
                            </label>
                            <app-dropdown [options]="estadosOptions" optionLabel="label" optionValue="value"
                                [(ngModel)]="formulario.estadoDocumentacion" name="estadoDocumentacion"
                                placeholder="Seleccione estado" styleClass="w-full">
                            </app-dropdown>
                        </div>
                    </div>

                    <!-- Descripción -->
                    <div class="space-y-2">
                        <label class="block text-sm font-bold text-gray-700 flex items-center">
                            <i class="pi pi-align-left mr-2 text-green-600"></i>
                            Descripción
                        </label>
                        <app-textarea name="descripcion" [(ngModel)]="formulario.descripcion"
                            [rows]="4" placeholder="Describa el subproceso..." styleClass="w-full">
                        </app-textarea>
                    </div>

                    <!-- Botones -->
                    <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
                        <app-button-cancel label="Cancelar" icon="pi pi-times" [disabled]="cargando"
                            (onClick)="cancelar()">
                        </app-button-cancel>
                        <app-button-primary type="submit" [label]="modoEdicion ? 'Actualizar' : 'Guardar'"
                            [icon]="cargando ? 'pi pi-spin pi-spinner' : 'pi pi-save'"
                            [disabled]="!formSubproceso.valid || cargando" [loading]="cargando">
                        </app-button-primary>
                    </div>
                </form>
            </p-card>
        </div>

        <!-- Toggle Columnas -->
        <div class="mb-4 bg-white p-4 rounded-lg shadow-sm border border-gray-200">
            <div class="flex items-center gap-3">
                <i class="pi pi-table text-green-600 text-xl"></i>
                <label class="font-semibold text-gray-700">Columnas visibles:</label>
                <p-multiSelect [options]="cols" [(ngModel)]="selectedColumns" optionLabel="header"
                    selectedItemsLabel="{0} columnas seleccionadas" placeholder="Seleccionar columnas"
                    [maxSelectedLabels]="3" styleClass="w-full md:w-80">
                </p-multiSelect>
            </div>
        </div>

        <!-- Tabla -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <app-data-table [value]="subprocesos" [columns]="selectedColumns" [showPaginator]="true" [rows]="10"
                [rowsPerPageOptions]="[5, 10, 25, 50]"
                [globalFilterFields]="['codigo', 'nombre', 'procesoNombre', 'subprocesoPadreNombre']"
                [loading]="cargando" [sortMode]="'multiple'" [colSpan]="selectedColumns.length + 1"
                emptyMessageTitle="No hay subprocesos registrados"
                emptyMessageSubtitle="Agregue un nuevo subproceso para comenzar"
                styleClass="p-datatable-striped p-datatable-gridlines" [showActions]="true">

                <ng-template #body let-sub>
                    <tr class="hover:bg-green-50 transition-colors duration-200">
                        <td *ngIf="isColumnVisible('nivel')" class="text-center">
                            <p-tag [value]="getNivelLabel(sub.nivel)"
                                [severity]="getNivelSeverity(sub.nivel)" styleClass="font-bold">
                            </p-tag>
                        </td>
                        <td *ngIf="isColumnVisible('codigo')" class="text-center">
                            <span class="font-mono font-bold text-green-700 bg-green-50 px-3 py-1 rounded-full">
                                {{ sub.codigo }}
                            </span>
                        </td>
                        <td *ngIf="isColumnVisible('nombre')" class="text-left">
                            <div class="font-medium text-gray-800">{{ sub.nombre }}</div>
                            <div *ngIf="sub.descripcion" class="text-xs text-gray-500 mt-1 line-clamp-2">
                                {{ sub.descripcion }}
                            </div>
                        </td>
                        <td *ngIf="isColumnVisible('procesoNombre')" class="text-center">
                            <p-tag [value]="sub.procesoNombre" severity="info" styleClass="font-semibold">
                            </p-tag>
                        </td>
                        <td *ngIf="isColumnVisible('subprocesoPadreNombre')" class="text-center">
                            <span *ngIf="sub.subprocesoPadreNombre; else sinPadreSP" class="text-gray-700 text-sm">
                                {{ sub.subprocesoPadreNombre }}
                            </span>
                            <ng-template #sinPadreSP>
                                <span class="text-gray-400 text-xs italic">— SP-N1 (sin padre)</span>
                            </ng-template>
                        </td>
                        <td *ngIf="isColumnVisible('estadoDocumentacion')" class="text-center">
                            <p-tag [value]="getEstadoNombre(sub.estadoDocumentacion)"
                                [severity]="getEstadoSeverity(sub.estadoDocumentacion)" styleClass="font-semibold">
                            </p-tag>
                        </td>
                        <td *ngIf="isColumnVisible('porcentajeAvance')" class="text-center px-4">
                            <div class="flex flex-col items-center gap-2">
                                <p-progressBar [value]="sub.porcentajeAvance" [showValue]="true"
                                    [style]="{'height': '24px', 'width': '100%', 'min-width': '120px'}">
                                </p-progressBar>
                                <span class="text-xs font-semibold" [ngClass]="{
                                    'text-red-600': sub.porcentajeAvance < 30,
                                    'text-yellow-600': sub.porcentajeAvance >= 30 && sub.porcentajeAvance < 60,
                                    'text-blue-600': sub.porcentajeAvance >= 60 && sub.porcentajeAvance < 90,
                                    'text-green-600': sub.porcentajeAvance >= 90
                                }">
                                    {{ sub.porcentajeAvance }}%
                                </span>
                            </div>
                        </td>
                        <td *ngIf="isColumnVisible('cantidadHijos')" class="text-center">
                            <p-tag [value]="getCantidadHijos(sub).toString()" severity="secondary"
                                styleClass="font-bold text-lg">
                            </p-tag>
                        </td>
                        <td class="text-center">
                            <div class="flex items-center justify-center gap-2">
                                <button pButton pRipple type="button" icon="pi pi-pencil"
                                    class="p-button-rounded p-button-warning p-button-sm" pTooltip="Editar"
                                    tooltipPosition="top" (click)="editarSubproceso(sub)">
                                </button>
                                <button pButton pRipple type="button" icon="pi pi-trash"
                                    class="p-button-rounded p-button-danger p-button-sm" pTooltip="Eliminar"
                                    tooltipPosition="top" (click)="eliminar(sub)">
                                </button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </app-data-table>
        </div>
    </app-panel>
</div>
