<div class="container-fluid py-4">
  <div class="row">
    <div class="col-12">
      <p-panel header="Gestión de Macroprocesos" [toggleable]="false">
        <ng-template pTemplate="icons">
          <button pButton pRipple type="button" icon="pi pi-plus"
                  class="p-button-rounded p-button-success p-button-sm"
                  (click)="nuevoMacroproceso()" pTooltip="Nuevo Macroproceso"></button>
        </ng-template>

        <!-- Formulario Desglosable (Inline Expandible) -->
        <div *ngIf="mostrarFormulario" class="mb-4">
          <p-card [header]="modoEdicion ? 'Editar Macroproceso' : 'Nuevo Macroproceso'"
                  styleClass="p-card-form p-4">
            <form (ngSubmit)="guardar()" #formMacroproceso="ngForm">
              <div class="grid">
                <div class="col-12 md:col-6">
                  <label for="unidadEstrategica" class="block font-medium mb-2">Código de Macroproceso *</label>
                  <input pInputText id="unidadEstrategica" [(ngModel)]="formulario.unidadEstrategica"
                         name="unidadEstrategica" required class="w-full"
                         placeholder="Ej: VDC, UTIC, VAD">
                </div>
                <div class="col-12 md:col-6">
                  <label for="tipo" class="block font-medium mb-2">Unidad Estratégica *</label>
                  <select class="p-inputtext w-full" [(ngModel)]="formulario.tipo" name="tipo" required>
                    <option *ngFor="let tipo of tiposMacroproceso" [value]="tipo">{{ tipo }}</option>
                  </select>
                </div>
              </div>

              <div class="grid mt-3">
                <div class="col-12">
                  <label for="nombre" class="block font-medium mb-2">Nombre del Macroproceso *</label>
                  <input pInputText id="nombre" [(ngModel)]="formulario.nombre" name="nombre"
                         required class="w-full" placeholder="Ingrese el nombre del macroproceso">
                </div>
              </div>

              <div class="grid mt-3">
                <div class="col-12">
                  <label for="descripcion" class="block font-medium mb-2">Descripción</label>
                  <textarea pInputTextarea id="descripcion" [(ngModel)]="formulario.descripcion"
                            name="descripcion" rows="3" class="w-full"
                            placeholder="Describa el macroproceso"></textarea>
                </div>
              </div>

              <div class="grid mt-3">
                <div class="col-12 md:col-6">
                  <label for="responsablePrincipal" class="block font-medium mb-2">Responsable Principal *</label>
                  <input pInputText id="responsablePrincipal" [(ngModel)]="formulario.responsablePrincipal"
                         name="responsablePrincipal" required class="w-full"
                         placeholder="Nombre del responsable">
                </div>
                <div class="col-12 md:col-6">
                  <label for="estadoDocumentacion" class="block font-medium mb-2">Estado de Documentación</label>
                  <select class="p-inputtext w-full" [(ngModel)]="formulario.estadoDocumentacion"
                          name="estadoDocumentacion">
                    <option *ngFor="let estado of estadosDocumentacion" [value]="estado">
                      {{ getEstadoNombre(estado) }}
                    </option>
                  </select>
                </div>
              </div>

              <div class="grid mt-3">
                <div class="col-12">
                  <label for="objetivosEstrategicos" class="block font-medium mb-2">Objetivos Estratégicos</label>
                  <textarea pInputTextarea id="objetivosEstrategicos" [(ngModel)]="formulario.objetivosEstrategicos"
                            name="objetivosEstrategicos" rows="2" class="w-full"
                            placeholder="Describa los objetivos estratégicos"></textarea>
                </div>
              </div>

              <div class="flex justify-content-end gap-2 mt-4">
                <button pButton type="button" label="Cancelar" icon="pi pi-times"
                        class="p-button-danger p-3" (click)="cancelar()"></button>
                <button pButton type="submit" [label]="modoEdicion ? 'Actualizar' : 'Guardar'"
                        icon="pi pi-save" class="p-button-success p-3"
                        [disabled]="!formMacroproceso.valid"></button>
              </div>
            </form>
          </p-card>
        </div>

        <!-- Column Toggle -->
        <div class="mb-3">
          <p-multiSelect [options]="cols" [(ngModel)]="selectedColumns" optionLabel="header"
                         selectedItemsLabel="{0} columnas seleccionadas"
                         placeholder="Seleccionar columnas"
                         styleClass="column-toggle"></p-multiSelect>
        </div>

        <!-- Tabla PrimeNG con scroll horizontal y sorting -->
        <div class="table-wrapper">
        <p-table [value]="macroprocesos"
                 styleClass="p-datatable-striped p-datatable-gridlines"
                 [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5, 10, 25, 50]"
                 [globalFilterFields]="['codigo', 'nombre', 'tipo', 'unidadEstrategica', 'responsablePrincipal']">

          <ng-template pTemplate="header">
            <tr>
              <th *ngIf="isColumnVisible('codigo')" pSortableColumn="codigo" style="min-width: 120px">
                Código <p-sortIcon field="codigo"></p-sortIcon>
              </th>
              <th *ngIf="isColumnVisible('tipo')" pSortableColumn="tipo" style="min-width: 100px">
                Tipo <p-sortIcon field="tipo"></p-sortIcon>
              </th>
              <th *ngIf="isColumnVisible('nombre')" pSortableColumn="nombre" style="min-width: 200px">
                Nombre <p-sortIcon field="nombre"></p-sortIcon>
              </th>
              <th *ngIf="isColumnVisible('unidadEstrategica')" pSortableColumn="unidadEstrategica" style="min-width: 150px">
                Unidad Estratégica <p-sortIcon field="unidadEstrategica"></p-sortIcon>
              </th>
              <th *ngIf="isColumnVisible('responsablePrincipal')" pSortableColumn="responsablePrincipal" style="min-width: 150px">
                Responsable <p-sortIcon field="responsablePrincipal"></p-sortIcon>
              </th>
              <th *ngIf="isColumnVisible('estadoDocumentacion')" pSortableColumn="estadoDocumentacion" style="min-width: 150px">
                Estado <p-sortIcon field="estadoDocumentacion"></p-sortIcon>
              </th>
              <th *ngIf="isColumnVisible('porcentajeAvance')" pSortableColumn="porcentajeAvance" style="min-width: 150px">
                Avance <p-sortIcon field="porcentajeAvance"></p-sortIcon>
              </th>
              <th *ngIf="isColumnVisible('cantidadProcesos')" pSortableColumn="cantidadProcesos" style="min-width: 100px">
                Procesos <p-sortIcon field="cantidadProcesos"></p-sortIcon>
              </th>
              <th style="min-width: 120px; text-align: center">Acciones</th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-mp>
            <tr>
              <td *ngIf="isColumnVisible('codigo')">
                <strong>{{ mp.codigo }}</strong>
              </td>
              <td *ngIf="isColumnVisible('tipo')">
                <p-tag [value]="mp.tipo" severity="info"></p-tag>
              </td>
              <td *ngIf="isColumnVisible('nombre')">{{ mp.nombre }}</td>
              <td *ngIf="isColumnVisible('unidadEstrategica')">{{ mp.unidadEstrategica }}</td>
              <td *ngIf="isColumnVisible('responsablePrincipal')">{{ mp.responsablePrincipal }}</td>
              <td *ngIf="isColumnVisible('estadoDocumentacion')">
                <p-tag [value]="getEstadoNombre(mp.estadoDocumentacion)"
                       [severity]="getEstadoSeverity(mp.estadoDocumentacion)"></p-tag>
              </td>
              <td *ngIf="isColumnVisible('porcentajeAvance')">
                <p-progressBar [value]="mp.porcentajeAvance" [showValue]="true"
                               [style]="{'height': '20px'}"></p-progressBar>
              </td>
              <td *ngIf="isColumnVisible('cantidadProcesos')">
                <p-tag [value]="(mp.cantidadProcesos || 0).toString()" severity="secondary"></p-tag>
              </td>
              <td style="text-align: center">
                <button pButton pRipple type="button" icon="pi pi-pencil"
                        class="p-button-rounded p-button-text p-button-warning"
                        (click)="editarMacroproceso(mp)" pTooltip="Editar"></button>
                <button pButton pRipple type="button" icon="pi pi-trash"
                        class="p-button-rounded p-button-text p-button-danger"
                        (click)="eliminar(mp)" pTooltip="Eliminar"></button>
              </td>
            </tr>
          </ng-template>

          <ng-template pTemplate="emptymessage">
            <tr>
              <td [attr.colspan]="selectedColumns.length + 1" class="text-center p-4">
                <i class="pi pi-inbox" style="font-size: 2rem; color: var(--text-color-secondary)"></i>
                <p class="mt-2 text-color-secondary">No hay macroprocesos registrados</p>
              </td>
            </tr>
          </ng-template>
        </p-table>
        </div>
      </p-panel>
    </div>
  </div>
</div>
